<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Fragments UI</title>
    <link rel="stylesheet" href="https://unpkg.com/bamboo.css" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="./app.js"></script>
</head>
<body>
    <div class="container">
        <h1>Fragments UI</h1>
        <nav>
            <button id="login">Login</button>
            <button id="logout">Logout</button>
        </nav>
        <section hidden id="user" class="user-section">
            <h2>Hello <span class="username"></span>!</h2>
            <div class="content">
                <div class="fragment-creation">
                    <h3>Create a Fragment</h3>
                    <label for="fragmentType">Select Content Type:</label>
                    <select id="fragmentType">
                        <option value="text/plain">text/plain</option>
                        <option value="text/markdown">text/markdown</option>
                        <option value="text/html">text/html</option>
                        <option value="text/csv">text/csv</option>
                        <option value="application/json">application/json</option>
                    </select>
                    <textarea id="fragmentText" placeholder="Enter your fragment"></textarea>
                    <button id="createFragment">Create Fragment</button>
                    <div id="drop-area" class="drop-area">
                        <p>Drag & Drop your file here</p>
                        <input type="file" id="fileInput" hidden>
                    </div>
                    <div id="fragmentStatus"></div>
                    <input type="text" id="fragmentId" placeholder="Enter Fragment ID" />
                    <button id="fetchFragment">Fetch Fragment</button>
                    <div id="fragmentDetails" hidden>
                        <h3>Fragment Details</h3>
                        <div class="scroll-container">
                            <table id="fragment-details-table">
                                <thead>
                                    <tr>
                                        <th>Property</th>
                                        <th>Value</th>
                                    </tr>
                                </thead>
                                <tbody id="fragment-details-body"></tbody>
                            </table>
                        </div>
                    </div>
                    
                </div>
                <div class="fragment-list">
                    <h3>Your Fragments</h3>
                    <table id="fragmentTable">
                        <thead>
                            <tr>
                                <th>Fragment ID</th>
                                <th>Type</th>
                                <th>Created</th>
                                <th>Updated</th>
                                <th>Size</th>
                                <th>Info</th>
                            </tr>
                        </thead>
                        <tbody id="fragmentTableBody">
                            <tr><td colspan="4">No fragments available.</td></tr>
                        </tbody>

                    </table>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
